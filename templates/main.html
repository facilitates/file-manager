<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="档案室">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<title>📚 档案室 — 你的私人资料馆</title>
<style>
:root {
  --bg-base: #090d12;
  --bg-surface: rgba(15,20,28,0.82);
  --bg-surface-hover: rgba(22,28,38,0.88);
  --bg-glass: rgba(18,24,34,0.65);
  --bg-glass-hover: rgba(24,32,44,0.78);
  --bg-elevated: rgba(28,36,50,0.9);
  --glass-border: rgba(240,160,64,0.08);
  --glass-border-hover: rgba(240,160,64,0.18);
  --glass-shadow: 0 4px 32px rgba(0,0,0,0.3);
  --glass-blur: 16px;
  --accent: #f0a040;
  --accent-glow: rgba(240,160,64,0.2);
  --accent-dim: #d4892a;
  --accent-text: #f5c070;
  --sage: #2dd4bf;
  --sage-dim: #0d9488;
  --sage-glow: rgba(45,212,191,0.12);
  --success: #3fb950;
  --danger: #f85149;
  --danger-glow: rgba(248,81,73,0.12);
  --warning: #f0a040;
  --info: #58a6ff;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --text-tertiary: #484f58;
  --text-inverse: #0d1117;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
  --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px; --space-12: 48px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-xl: 18px;
  --font-body: 'Plus Jakarta Sans','Noto Sans SC',-apple-system,sans-serif;
  --font-mono: 'JetBrains Mono','Fira Code',monospace;
  --font-size-xs: 11px; --font-size-sm: 12px; --font-size-md: 13px; --font-size-lg: 15px; --font-size-xl: 18px;
  --duration-fast: .15s; --duration-md: .25s;
  --ease-out: cubic-bezier(.16,1,.3,1);
  --ease-spring: cubic-bezier(.34,1.56,.64,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font-body);background:var(--bg-base);color:var(--text-primary);
  display:flex;-webkit-font-smoothing:antialiased;
}
.bg-noise{
  position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size:256px;
}
.sidebar{
  position:relative;z-index:10;width:240px;min-width:240px;height:100vh;
  background:var(--bg-surface);border-right:1px solid var(--glass-border);
  backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));
  display:flex;flex-direction:column;overflow:hidden;
}
.sidebar-brand{padding:var(--space-4) var(--space-4) var(--space-2);display:flex;align-items:center;gap:var(--space-2)}
.sidebar-brand .logo{font-size:22px}
.sidebar-brand h2{font-size:var(--font-size-lg);font-weight:700;color:var(--accent-text)}
.sidebar-user{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);margin-bottom:var(--space-2)}
.sidebar-user .avatar{font-size:20px}
.sidebar-user .name{color:var(--text-primary);font-size:var(--font-size-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-user .logout{color:var(--text-tertiary);cursor:pointer;margin-left:auto;font-size:var(--font-size-xs);padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);transition:all var(--duration-fast) var(--ease-out)}
.sidebar-user .logout:hover{color:var(--danger);background:var(--danger-glow)}
.sidebar-folders{flex:1;overflow-y:auto;padding:var(--space-3)}
.sidebar-folders .folder{
  display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);
  border-radius:var(--radius-sm);cursor:pointer;transition:all var(--duration-fast);
  font-size:var(--font-size-md);color:var(--text-secondary);position:relative;
  margin-bottom:1px;
}
.sidebar-folders .folder:hover{background:var(--bg-glass-hover);color:var(--text-primary)}
.sidebar-folders .folder.active{background:var(--accent-glow);color:var(--accent-text);font-weight:600}
.sidebar-folders .folder.active::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
.sidebar-folders .folder .icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.sidebar-folders .folder .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sidebar-folders .folder .count{font-size:10px;color:var(--text-tertiary);background:var(--bg-glass);padding:1px 6px;border-radius:10px}
.sidebar-folders .folder .del-btn{display:none;color:var(--text-tertiary);border:none;background:none;cursor:pointer;font-size:14px;padding:2px;border-radius:4px;transition:all var(--duration-fast)}
.sidebar-folders .folder:hover .del-btn{display:block}
.sidebar-folders .folder .del-btn:hover{opacity:1;background:var(--danger-glow)}
.sidebar-divider{font-size:var(--font-size-xs);color:var(--text-tertiary);padding:var(--space-3) var(--space-3) var(--space-1);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.sidebar-add{margin:var(--space-2) var(--space-3) var(--space-3);display:flex;gap:var(--space-2)}
.sidebar-add input{flex:1;background:var(--bg-glass);border:1px solid var(--glass-border);border-radius:var(--radius-sm);padding:var(--space-2) var(--space-3);color:var(--text-primary);font-size:var(--font-size-sm);font-family:var(--font-body);outline:none}
.sidebar-add input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.sidebar-add button{font-size:18px;background:var(--accent);color:var(--text-inverse);border:none;border-radius:var(--radius-sm);width:36px;cursor:pointer;font-weight:700;transition:all var(--duration-fast) var(--ease-spring)}
.sidebar-add button:hover{background:var(--accent-dim);transform:scale(1.05)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1}
.topbar{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-5);background:var(--bg-surface);border-bottom:1px solid var(--glass-border);backdrop-filter:blur(var(--glass-blur));-webkit-backdrop-filter:blur(var(--glass-blur));z-index:20}
.breadcrumb{font-size:var(--font-size-md);color:var(--text-secondary);display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.breadcrumb a{color:var(--accent-text);cursor:pointer;text-decoration:none;font-weight:500}
.breadcrumb a:hover{text-decoration:underline}
.spacer{flex:1}
.search-box{position:relative;display:flex;align-items:center}
.search-box input{background:var(--bg-glass);border:1px solid var(--glass-border);border-radius:20px;padding:5px 32px 5px 12px;color:var(--text-primary);font-size:var(--font-size-sm);width:140px;outline:none;font-family:var(--font-body);transition:all var(--duration-fast)}
.search-box input:focus{border-color:var(--accent);width:180px}
.search-box .clear{position:absolute;right:8px;color:var(--text-tertiary);cursor:pointer;font-size:11px;display:none}
.search-box .clear.visible{display:block}
.sort-btn{background:var(--bg-glass);border:1px solid var(--glass-border);color:var(--text-secondary);padding:4px 10px;border-radius:6px;font-size:var(--font-size-xs);cursor:pointer;font-family:var(--font-body);transition:all var(--duration-fast)}
.sort-btn.active{background:var(--accent);color:var(--text-inverse);border-color:var(--accent)}
.batch-toggle-btn{display:none;background:var(--bg-surface);border:1.5px solid var(--glass-border);border-radius:20px;color:var(--text-secondary);padding:var(--space-1) var(--space-4);cursor:pointer;font-size:var(--font-size-xs);transition:all var(--duration-fast) var(--ease-out);font-family:var(--font-body);font-weight:600;white-space:nowrap;gap:var(--space-1);align-items:center}
.batch-toggle-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-glow)}
.batch-toggle-btn.active{background:var(--accent);border-color:var(--accent);color:var(--text-inverse)}
.batch-toggle-btn.visible{display:inline-flex}
.toolbox-quick-btn{background:var(--bg-surface);border:1.5px solid var(--glass-border);border-radius:20px;color:var(--text-secondary);padding:5px 12px;cursor:pointer;font-size:16px;transition:all .15s ease-out;font-family:var(--font-body);font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.toolbox-quick-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-glow);transform:scale(1.05)}
.view-toggle{display:flex;gap:2px;background:var(--bg-glass);border-radius:var(--radius-sm);padding:2px}
.view-toggle button{background:none;border:none;color:var(--text-tertiary);padding:4px 8px;border-radius:4px;cursor:pointer;font-size:15px;transition:all var(--duration-fast)}
.view-toggle button.active{background:var(--accent);color:var(--text-inverse)}
.console-bar{display:flex;align-items:center;padding:var(--space-1) var(--space-5);background:var(--bg-glass);border-bottom:1px solid var(--glass-border);gap:var(--space-4);font-size:var(--font-size-xs);color:var(--text-tertiary)}
.console-bar .metric{display:flex;align-items:center;gap:var(--space-1)}
.console-bar .metric .val{color:var(--text-secondary);font-weight:600}
.console-bar .refresh{cursor:pointer;color:var(--accent);font-size:12px;transition:all var(--duration-fast);margin-left:auto}
.console-bar .refresh:hover{color:var(--accent-text)}
.batch-bar{display:none;align-items:center;padding:var(--space-2) var(--space-5);background:var(--accent-glow);border-bottom:1px solid var(--accent);gap:var(--space-3)}
.batch-bar.show{display:flex}
.batch-bar .count{font-size:var(--font-size-sm);color:var(--accent-text);font-weight:600}
.batch-bar button{background:rgba(240,160,64,.15);border:1px solid var(--accent);color:var(--accent-text);padding:4px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:var(--font-size-xs);font-weight:600;font-family:var(--font-body);transition:all var(--duration-fast)}
.batch-bar button:hover{background:var(--accent);color:var(--text-inverse)}
.content-area{flex:1;overflow-y:auto;padding:var(--space-4) var(--space-5);position:relative}
.drop-zone{border:2px dashed var(--glass-border);border-radius:var(--radius-lg);padding:var(--space-8);text-align:center;margin-bottom:var(--space-4);transition:all var(--duration-md);cursor:pointer}
.drop-zone:hover,.drop-zone.drag-over{border-color:var(--accent);background:var(--accent-glow)}
.drop-zone .icon{font-size:32px;margin-bottom:var(--space-2)}
.drop-zone h3{font-size:var(--font-size-lg);color:var(--text-primary);margin-bottom:var(--space-1)}
.drop-zone p{font-size:var(--font-size-sm);color:var(--text-tertiary)}
.file-toolbar{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4);flex-wrap:wrap}
.file-toolbar .ai-btn{background:var(--sage-glow);border:1px solid var(--sage);color:var(--sage);padding:5px 14px;border-radius:var(--radius-sm);cursor:pointer;font-size:var(--font-size-xs);font-weight:600;font-family:var(--font-body);transition:all var(--duration-fast)}
.file-toolbar .ai-btn:hover{background:var(--sage);color:var(--text-inverse)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--space-4)}
.grid.list{display:flex;flex-direction:column;gap:var(--space-2)}
.card{
  background:var(--bg-glass);border:1px solid var(--glass-border);
  border-radius:var(--radius-md);overflow:hidden;transition:all var(--duration-md) var(--ease-spring);
  position:relative;animation:fadeIn .4s var(--ease-out) both;cursor:default;
}
.card:hover{border-color:var(--glass-border-hover);box-shadow:var(--glass-shadow);transform:translateY(-2px)}
.card.selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 20px var(--accent-glow)}
.card .preview{position:relative;aspect-ratio:1;background:var(--bg-base);display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .preview img{width:100%;height:100%;object-fit:cover}
.card .preview .file-icon{font-size:48px;opacity:.7}
.card .preview .play-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;cursor:pointer;opacity:0;transition:opacity var(--duration-md);background:rgba(0,0,0,.3)}
.card:hover .play-icon{opacity:1}
.card .cb-overlay{position:absolute;top:var(--space-2);left:var(--space-2);z-index:5}
.card.show-cb .preview{filter:brightness(.8)}
.cb-overlay input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.card .info{padding:var(--space-3) var(--space-3)}
.card .name{font-size:var(--font-size-md);color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:var(--space-1);font-weight:600}
.card .fav-star{color:var(--accent);cursor:pointer;font-size:14px;opacity:.2;transition:all var(--duration-fast) var(--ease-spring);display:inline-block;vertical-align:top;margin-left:2px}
.card .fav-star.active,.card .fav-star:hover{opacity:1;transform:scale(1.2)}
.card .meta{font-size:var(--font-size-xs);color:var(--text-tertiary);display:flex;align-items:center;gap:var(--space-2);flex-wrap:wrap}
.card .ai-tag{font-size:9px;background:var(--sage-glow);color:var(--sage);padding:2px 7px;border-radius:var(--radius-sm);font-weight:700}
.card .classifying-tag{font-size:9px;background:var(--accent-glow);color:var(--accent);padding:2px 7px;border-radius:var(--radius-sm);font-weight:700;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
.card .vis-tag{font-size:9px;padding:2px 7px;border-radius:var(--radius-sm);cursor:pointer;transition:all var(--duration-fast);font-weight:600;user-select:none}
.card .vis-tag.private{background:var(--danger-glow);color:var(--danger)}
.card .vis-tag.public{background:var(--sage-glow);color:var(--sage)}
.card .vis-tag.shared{background:var(--accent-glow);color:var(--accent)}
.card .actions{display:flex;gap:var(--space-1);padding:var(--space-2) var(--space-3);border-top:1px solid var(--glass-border)}
.card .actions button{
  background:var(--bg-glass);border:1px solid var(--glass-border);border-radius:var(--radius-sm);
  color:var(--text-tertiary);padding:3px 8px;cursor:pointer;font-size:11px;transition:all var(--duration-fast)
}
.card .actions button:hover{color:var(--text-primary);border-color:var(--glass-border-hover)}
.grid.list .card{display:flex;align-items:center;padding:var(--space-2) var(--space-3)}
.grid.list .card .preview{width:40px;height:40px;aspect-ratio:unset;border-radius:var(--radius-sm);flex-shrink:0}
.grid.list .card .preview .file-icon{font-size:24px}
.grid.list .card .info{flex:1;padding:0 var(--space-3)}
.grid.list .card .actions{border-top:none;border-left:1px solid var(--glass-border)}
.grid.list .card .play-icon{display:none}
.empty{text-align:center;padding:var(--space-12) var(--space-4);grid-column:1/-1}
.empty .icon{font-size:48px;margin-bottom:var(--space-3);opacity:.3}
.empty h3{font-size:var(--font-size-lg);color:var(--text-secondary);margin-bottom:var(--space-1)}
.empty p{font-size:var(--font-size-sm);color:var(--text-tertiary)}
.dup-toolbar{display:none;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4)}
.dup-toolbar.show{display:flex}
.dup-grid{display:none;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:var(--space-4)}
.dup-grid.show{display:grid}
.dup-group{background:var(--bg-glass);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:var(--space-4)}
.dup-group .hash{font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary);margin-bottom:var(--space-2);word-break:break-all}
.dup-group .size{font-size:var(--font-size-sm);color:var(--sage);margin-bottom:var(--space-3)}
.dup-group .dup-item{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-1) 0;font-size:var(--font-size-sm);color:var(--text-secondary)}
.dup-group .dup-item .keep{color:var(--success);font-weight:600;font-size:var(--font-size-xs)}
.trash-toolbar{display:none;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4)}
.trash-toolbar.show{display:flex}
.trash-grid{display:none;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--space-3)}
.trash-grid.show{display:grid}
.trash-card{background:var(--bg-glass);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:var(--space-3);display:flex;align-items:center;gap:var(--space-3)}
.trash-card .icon-big{font-size:28px;flex-shrink:0}
.trash-card .info{flex:1;overflow:hidden}
.trash-card .info .name{font-size:var(--font-size-md);color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:var(--space-1);font-weight:600}
.trash-card .info .meta{font-size:var(--font-size-xs);color:var(--text-tertiary);display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.trash-card .actions{display:flex;gap:var(--space-1);flex-shrink:0}
.trash-card .actions button{
  background:var(--bg-glass);border:1px solid var(--glass-border);border-radius:var(--radius-sm);
  color:var(--text-secondary);padding:3px 10px;cursor:pointer;font-size:var(--font-size-xs);font-family:var(--font-body);transition:all var(--duration-fast)
}
.trash-card .actions .btn-restore:hover{color:var(--sage);border-color:var(--sage)}
.trash-card .actions .btn-purge:hover{color:var(--danger);border-color:var(--danger)}
.expire-badge{font-size:9px;padding:1px 6px;border-radius:10px}
.expire-badge.ok{background:var(--sage-glow);color:var(--sage)}
.expire-badge.warn{background:var(--accent-glow);color:var(--accent)}
.expire-badge.danger{background:var(--danger-glow);color:var(--danger)}
.modal-overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.7);align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:var(--bg-elevated);border:1px solid var(--glass-border);border-radius:var(--radius-xl);padding:var(--space-6);max-width:90vw;max-height:90vh;overflow-y:auto;box-shadow:var(--glass-shadow);position:relative}
.modal img{max-width:100%;max-height:75vh;border-radius:var(--radius-md)}
.modal video{max-width:100%;max-height:75vh;border-radius:var(--radius-md)}
.text-preview{color:var(--text-primary);line-height:1.6}
.text-preview .text-header{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4);font-weight:700;font-size:var(--font-size-lg)}
.text-preview pre{background:var(--bg-base);border-radius:var(--radius-md);padding:var(--space-4);overflow-x:auto;font-family:var(--font-mono);font-size:var(--font-size-sm);line-height:1.5}
.text-action{background:var(--bg-glass);border:1px solid var(--glass-border);color:var(--text-secondary);padding:4px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:var(--font-size-sm);font-family:var(--font-body);transition:all var(--duration-fast)}
.text-action:hover{color:var(--text-primary);border-color:var(--glass-border-hover)}
.pdf-container{max-height:70vh;overflow-y:auto;background:var(--bg-base);border-radius:var(--radius-md);padding:var(--space-4)}
.pdf-container canvas{display:block;margin:0 auto var(--space-3);max-width:100%}
.vis-popup{position:fixed;z-index:200;background:var(--bg-elevated);border:1px solid var(--glass-border);border-radius:var(--radius-md);padding:var(--space-2);box-shadow:var(--glass-shadow);min-width:150px}
.vis-option{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);cursor:pointer;transition:all var(--duration-fast);font-size:var(--font-size-sm);color:var(--text-primary)}
.vis-option:hover{background:var(--bg-glass-hover)}
.vis-option small{display:block;font-size:var(--font-size-xs);color:var(--text-tertiary)}
.share-dialog{padding:var(--space-2)}
.share-dialog h3{font-size:var(--font-size-xl);margin-bottom:var(--space-4);font-weight:700}
.share-dialog .user-row{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) 0;font-size:var(--font-size-md);border-bottom:1px solid var(--glass-border)}
.share-dialog .btn-row{display:flex;gap:var(--space-2);margin-top:var(--space-5)}
.share-dialog .btn-row button{flex:1;padding:var(--space-3);border-radius:var(--radius-sm);border:none;cursor:pointer;font-size:var(--font-size-md);font-weight:700;font-family:var(--font-body)}
.share-dialog .btn-save{background:var(--accent);color:var(--text-inverse);box-shadow:0 0 16px var(--accent-glow)}
.share-dialog .btn-cancel{background:var(--bg-surface);color:var(--text-secondary)}
.share-dialog .expire-row{margin-top:var(--space-3);display:flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-sm);color:var(--text-secondary)}
.share-dialog .expire-row select{background:var(--bg-surface);border:1px solid var(--glass-border);color:var(--text-primary);padding:var(--space-1) var(--space-2);border-radius:var(--radius-sm);font-size:var(--font-size-sm);font-family:var(--font-body)}
.confirm-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.6);align-items:center;justify-content:center}
.confirm-box{background:var(--bg-elevated);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:var(--space-6);max-width:360px;text-align:center;box-shadow:var(--glass-shadow)}
.confirm-box p{font-size:var(--font-size-md);color:var(--text-primary);margin-bottom:var(--space-5)}
.confirm-box .btns{display:flex;gap:var(--space-2)}
.confirm-box .btns button{flex:1;padding:var(--space-2) var(--space-4);border-radius:var(--radius-sm);border:none;cursor:pointer;font-weight:600;font-size:var(--font-size-sm);font-family:var(--font-body)}
.confirm-box .btn-confirm{background:var(--danger);color:#fff}
.confirm-box .btn-cancel{background:var(--bg-surface);color:var(--text-secondary)}
.toast-container{position:fixed;top:var(--space-4);right:var(--space-4);z-index:500;display:flex;flex-direction:column;gap:var(--space-2)}
.toast{padding:var(--space-3) var(--space-5);border-radius:var(--radius-md);font-size:var(--font-size-sm);font-weight:600;animation:slideIn .3s var(--ease-spring);pointer-events:none}
.toast.success{background:rgba(63,185,80,.15);color:var(--success);border:1px solid var(--success)}
.toast.error{background:var(--danger-glow);color:var(--danger);border:1px solid var(--danger)}
.toast.info{background:var(--accent-glow);color:var(--accent-text);border:1px solid var(--accent)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.mobile-menu{display:none;position:fixed;top:12px;left:12px;z-index:60;background:var(--bg-surface);border:1px solid var(--glass-border);border-radius:var(--radius-sm);color:var(--text-primary);padding:6px 10px;font-size:18px;cursor:pointer}
@media(max-width:768px){
  .sidebar{position:fixed;left:-260px;top:0;bottom:0;transition:left var(--duration-md) var(--ease-out);z-index:50}
  .sidebar.open{left:0}
  .mobile-menu{display:block}
  .grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
  .topbar{padding:var(--space-3) var(--space-3)}
  .content-area{padding:var(--space-3)}
  .search-box input{width:100px}
  .search-box input:focus{width:140px}
}
</style>
</head>
<body>
<div class="bg-noise"></div>
<button class="mobile-menu" onclick="document.querySelector('.sidebar').classList.toggle('open')" aria-label="菜单">☰</button>

<div class="sidebar" id="sidebar">
  <div class="sidebar-brand"><span class="logo">📚</span><h2>档案室</h2></div>
  <div class="sidebar-user">
    <span class="avatar">👤</span>
    <span class="name" id="sidebarUsername">{{ user.username }}</span>
    <span class="logout" onclick="logout()">退出</span>
  </div>
  <div class="sidebar-folders" id="folderList">
    <div class="folder active" onclick="selectFolder('')" data-folder="" role="button" tabindex="0">
      <span class="icon">📂</span><span class="label">全部文件</span>
    </div>
    <div class="folder" onclick="selectFolder('',true)" data-folder="__fav__" role="button" tabindex="0">
      <span class="icon">⭐</span><span class="label">我的收藏</span>
    </div>
    <div class="sidebar-divider">文件夹</div>
    {% for f in folders %}
    <div class="folder" onclick="selectFolder('{{ f.name }}')" data-folder="{{ f.name }}">
      <span class="icon">📁</span><span class="label">{{ f.name }}</span>
      <span class="count">{{ f.count }}</span>
      <button class="del-btn" onclick="deleteFolder('{{ f.name }}', event)" title="删除">×</button>
    </div>
    {% endfor %}
    <div class="sidebar-divider">系统</div>
    <div class="folder" onclick="showToolbox()" data-folder="__tools__" role="button" tabindex="0">
      <span class="icon">🔧</span><span class="label">工具箱</span>
    </div>
    <div class="folder" onclick="showDuplicates()" data-folder="__dup__" role="button" tabindex="0">
      <span class="icon">🔍</span><span class="label">重复文件</span>
    </div>
    <div class="folder" onclick="showTrash()" data-folder="__trash__" role="button" tabindex="0">
      <span class="icon">🗑️</span><span class="label">回收站</span>
    </div>
  </div>
  <div class="sidebar-add">
    <input type="text" id="newFolderInput" placeholder="新建文件夹..." onkeydown="if(event.key==='Enter')addFolder()" aria-label="新建文件夹名称">
    <button onclick="addFolder()" aria-label="创建文件夹">＋</button>
  </div>
</div>

<div class="main">
  <div class="topbar">
    <div class="breadcrumb" id="breadcrumb"><a onclick="selectFolder('')" role="button" tabindex="0">根目录</a></div>
    <span class="spacer"></span>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索..." oninput="onSearch()" aria-label="搜索文件">
      <span class="clear" id="searchClear" onclick="clearSearch()">✕</span>
    </div>
    <button class="sort-btn active" id="sortName" onclick="setSort('name')">A-Z</button>
    <button class="sort-btn" id="sortSize" onclick="setSort('size')">大小</button>
    <button class="toolbox-quick-btn" onclick="showToolbox()" title="工具箱">🧰</button>
    <button id="batchToggle" class="batch-toggle-btn" onclick="toggleBatchMode()">☑️ 多选</button>
    <div class="view-toggle">
      <button class="active" onclick="setView('grid')" id="btnGrid" aria-label="网格视图">▦</button>
      <button onclick="setView('list')" id="btnList" aria-label="列表视图">☰</button>
    </div>
  </div>
  <div class="batch-bar" id="batchBar" role="toolbar" aria-label="批量操作">
    <span class="count" id="batchCount">已选 0 项</span>
    <span class="spacer"></span>
    <button onclick="batchDelete()">🗑 删除</button>
    <button onclick="batchMove()">📁 移动到...</button>
    <button onclick="batchDownload()">⬇ 下载</button>
    <button onclick="toggleBatchMode()">✕ 取消</button>
  </div>
  <div class="console-bar" id="consoleBar">
    <div class="metric">📄 文件 <span class="val" id="consoleFileCount">0 个</span></div>
    <div class="metric">💾 已用 <span class="val" id="consoleStorage">-</span></div>
    <div class="metric">🗑 回收站 <span class="val" id="consoleTrash">-</span></div>
    <span class="refresh" onclick="refreshConsole()" title="刷新统计">↻ 刷新</span>
  </div>
  <div class="content-area">
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div class="icon">📤</div>
      <h3>拖拽文件到这里上传</h3>
      <p>或点击选择 · 支持 Ctrl+V 粘贴</p>
      <input type="file" id="fileInput" multiple style="display:none" onchange="uploadFiles(this.files)" aria-label="选择文件上传">
    </div>
    <div class="file-toolbar" id="fileToolbar">
      <button class="ai-btn" onclick="classifyBatch()" title="AI 自动分类">🤖 AI 分类</button>
    </div>
    <div class="dup-toolbar" id="dupToolbar">
      <span style="font-weight:700;color:var(--accent-text)">🔍 重复文件检测</span>
      <span class="spacer"></span>
      <button style="background:var(--danger);color:#fff;border:none;border-radius:6px;padding:4px 14px;cursor:pointer;font-weight:600" onclick="batchDeleteDuplicates()">🗑 批量清理</button>
      <button style="background:var(--bg-surface);border:1px solid var(--glass-border);color:var(--text-secondary);border-radius:6px;padding:4px 14px;cursor:pointer" onclick="exitDupView()">← 返回</button>
    </div>
    <div class="trash-toolbar" id="trashToolbar">
      <span style="font-weight:700;color:var(--text-primary)" id="trashInfo">回收站</span>
      <span class="spacer"></span>
      <button id="trashBatchBtn" style="background:var(--bg-surface);border:1px solid var(--glass-border);color:var(--text-secondary);border-radius:6px;padding:4px 14px;cursor:pointer;font-size:12px" onclick="toggleTrashBatch()">☑️ 多选</button>
      <button style="background:var(--sage);color:#fff;border:none;border-radius:6px;padding:4px 14px;cursor:pointer;font-weight:600" onclick="batchRestoreTrash()">↩ 批量恢复</button>
      <button style="background:var(--danger);color:#fff;border:none;border-radius:6px;padding:4px 14px;cursor:pointer;font-weight:600" onclick="emptyTrash()">🗑 清空</button>
      <button style="background:var(--bg-surface);border:1px solid var(--glass-border);color:var(--text-secondary);border-radius:6px;padding:4px 14px;cursor:pointer" onclick="exitTrashView()">← 返回</button>
    </div>
    <div class="grid" id="fileGrid" role="list" aria-label="文件列表"></div>
    <div class="dup-grid" id="dupGrid"></div>
    <div class="trash-grid" id="trashGrid"></div>
  </div>
</div>

<div class="modal-overlay" id="previewModal" onclick="if(event.target===this)closePreview()">
  <div class="modal" id="previewContent"></div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmMsg"></p>
    <div class="btns">
      <button class="btn-cancel" onclick="closeConfirm()">取消</button>
      <button class="btn-confirm" id="confirmBtn">确定</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
const BASE=location.origin;
let allFiles=[],allFolders=[],allUsers=[];
let currentFolder='',favoritesOnly=false,currentSort='name',searchQuery='';
let batchMode=false,selectedFiles=new Set();
let viewMode='grid';
let dupGroups=[],isDupView=false;
let trashItems=[],trashBatchMode=false,trashSelected=new Set(),isTrashView=false;
let currentPublicOwner=null;
const bc=document.getElementById('breadcrumb'),grid=document.getElementById('fileGrid');

// Init
document.addEventListener('DOMContentLoaded',()=>{
  loadFolders();loadFiles();refreshConsole();loadUsers();
  // Drag & drop
  const dz=document.getElementById('dropZone');
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('drag-over')});
  dz.addEventListener('dragleave',()=>dz.classList.remove('drag-over'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('drag-over');uploadFiles(e.dataTransfer.files)});
  // Paste
  document.addEventListener('paste',e=>{if(e.clipboardData.files.length)uploadFiles(e.clipboardData.files)});
  // Keyboard shortcuts
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closePreview();closeConfirm();if(batchMode)toggleBatchMode()}});
});

// Toast
function toast(msg,type='info'){
  const c=document.getElementById('toastContainer');
  const el=document.createElement('div');el.className='toast '+type;el.textContent=msg;
  c.appendChild(el);setTimeout(()=>el.remove(),2500);
}

// Confirm
function showConfirm(msg,cb){
  document.getElementById('confirmMsg').textContent=msg;
  document.getElementById('confirmOverlay').style.display='flex';
  document.getElementById('confirmBtn').onclick=()=>{closeConfirm();cb()};
}
function closeConfirm(){document.getElementById('confirmOverlay').style.display='none'}

// Preview
function closePreview(){document.getElementById('previewModal').style.display='none'}
function preview(url,type){
  const m=document.getElementById('previewModal'),c=document.getElementById('previewContent');
  m.style.display='flex';c.className='modal';c.style.maxWidth='90vw';
  if(type==='image')c.innerHTML=`<img src="${url}" alt="预览">`;
  else if(type==='video')c.innerHTML=`<video src="${url}" controls autoplay></video>`;
}

// Download
function downloadFile(rel){window.open(BASE+'/uploads/'+rel,'_blank')}
function copyLink(url){navigator.clipboard.writeText(url).then(()=>toast('链接已复制','success'))}

// Logout
async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}

// Load users
async function loadUsers(){try{const r=await fetch('/api/users');const d=await r.json();allUsers=d.users||[]}catch(e){}}

// Format
function fmtSize(b){if(!b)return'0 B';const u=['B','KB','MB','GB'];let i=0;while(b>=1024&&i<3){b/=1024;i++}return b.toFixed(i?1:0)+' '+u[i]}

// ---- Folder nav ----
function selectFolder(name,fav){
  if(isTrashView)exitTrashView();
  if(isDupView)exitDupView();
  currentFolder=name;favoritesOnly=!!fav;currentPublicOwner=null;
  document.querySelectorAll('.sidebar-folders .folder').forEach(el=>el.classList.remove('active'));
  const el=document.querySelector(`.sidebar-folders [data-folder="${fav?'__fav__':name}"]`);
  if(el)el.classList.add('active');
  bc.innerHTML=fav?'<span>⭐ 我的收藏</span>':(name?`<a onclick="selectFolder('')" role="button" tabindex="0">根目录</a> <span>›</span> <span>${name}</span>`:`<a onclick="selectFolder('')" role="button" tabindex="0">根目录</a>`);
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('batchToggle').classList.toggle('visible',name||fav);
  loadFiles();
}
function selectPublicFolder(name,ownerId){
  if(isTrashView)exitTrashView();
  if(isDupView)exitDupView();
  currentFolder=name;favoritesOnly=false;currentPublicOwner=ownerId;
  document.querySelectorAll('.sidebar-folders .folder').forEach(el=>el.classList.remove('active'));
  const el=document.querySelector(`.sidebar-folders [data-folder="public_${ownerId}"]`);
  if(el)el.classList.add('active');
  bc.innerHTML='<a onclick="selectFolder(\'\')" role="button" tabindex="0">根目录</a> <span>›</span> <span>🌐 公开分享</span>';
  document.querySelector('.sidebar').classList.remove('open');
  document.getElementById('batchToggle').classList.remove('visible');
  loadFiles();
}
async function addFolder(){
  const input=document.getElementById('newFolderInput'),name=input.value.trim();
  if(!name)return;
  const r=await fetch('/api/folders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
  if(r.status===409){toast('文件夹已存在','error');return}
  input.value='';loadFolders();toast('已创建','success');
}
async function deleteFolder(name,event){
  event.stopPropagation();
  showConfirm(`确定删除「${name}」？`,async()=>{
    const r=await fetch('/api/folders/'+encodeURIComponent(name),{method:'DELETE'});
    const d=await r.json();if(d.error){toast(d.error,'error');return}
    if(currentFolder===name)selectFolder('');
    loadFolders();toast('已删除','success');
  });
}
async function loadFolders(){
  try{
    const r=await fetch('/api/folders');const d=await r.json();allFolders=d.folders||[];
    const list=document.getElementById('folderList');
    list.innerHTML=`<div class="folder${currentFolder===''&&!favoritesOnly&&!isTrashView&&!currentPublicOwner?' active':''}" onclick="selectFolder('')" data-folder="" role="button" tabindex="0"><span class="icon">📂</span><span class="label">全部文件</span></div><div class="folder${favoritesOnly&&!isTrashView?' active':''}" onclick="selectFolder('',true)" data-folder="__fav__" role="button" tabindex="0"><span class="icon">⭐</span><span class="label">我的收藏</span></div><div class="sidebar-divider">文件夹</div>`;
    for(const f of d.folders)list.innerHTML+=`<div class="folder${currentFolder===f.name&&!favoritesOnly&&!isTrashView&&!currentPublicOwner?' active':''}" onclick="selectFolder('${f.name}')" data-folder="${f.name}"><span class="icon">📁</span><span class="label">${f.name}</span><span class="count">${f.count}</span><button class="del-btn" onclick="deleteFolder('${f.name}',event)" title="删除">×</button></div>`;
    list.innerHTML+=`<div class="sidebar-divider">系统</div><div class="folder" onclick="showToolbox()" data-folder="__tools__"><span class="icon">🔧</span><span class="label">工具箱</span></div><div class="folder${isDupView?' active':''}" onclick="showDuplicates()" data-folder="__dup__"><span class="icon">🔍</span><span class="label">重复文件</span></div><div class="folder${isTrashView?' active':''}" onclick="showTrash()" data-folder="__trash__"><span class="icon">🗑️</span><span class="label">回收站</span></div>`;
    loadPublicFolders();
  }catch(e){}
}
// ---- File listing ----
async function loadFiles(){
  try{
    let q=currentFolder?'?folder='+encodeURIComponent(currentFolder):(favoritesOnly?'?fav=1':'');
    if(currentPublicOwner)q+=(q?'&':'?')+'public_owner='+currentPublicOwner;
    const r=await fetch('/api/files'+q);const d=await r.json();
    allFiles=d.files;document.getElementById('consoleFileCount').textContent=d.files.length+' 个';
    renderFiles();refreshConsole();
  }catch(e){grid.innerHTML='<div class="empty"><div class="icon">⚠️</div><h3>加载失败</h3></div>'}
}

function onSearch(){searchQuery=document.getElementById('searchInput').value.trim().toLowerCase();document.getElementById('searchClear').classList.toggle('visible',!!searchQuery);renderFiles()}
function clearSearch(){document.getElementById('searchInput').value='';searchQuery='';document.getElementById('searchClear').classList.remove('visible');renderFiles()}
function setSort(sort){currentSort=sort;document.querySelectorAll('.sort-btn').forEach(b=>b.classList.toggle('active',false));document.getElementById('sort'+sort[0].toUpperCase()+sort.slice(1)).classList.add('active');renderFiles()}
function setView(v){viewMode=v;document.getElementById('btnGrid').classList.toggle('active',v==='grid');document.getElementById('btnList').classList.toggle('active',v==='list');grid.className=v==='list'?'grid list':'grid';renderFiles()}

function getFileIcon(f){
  if(f.is_image)return `<img src="${f.url}" loading="lazy" onclick="preview('${f.url}','image')" alt="${f.original||f.name}">`;
  if(f.is_video)return `<div class="file-icon" onclick="preview('${f.url}','video')">🎬</div><div class="play-icon">▶</div>`;
  const ext=(f.original||f.name||'').split('.').pop().toLowerCase();
  if(ext==='pdf')return `<div class="file-icon" onclick="previewPDF('${f.rel}')">📕</div><div class="play-icon">📖</div>`;
  const icons={doc:'📘',docx:'📘',xls:'📗',xlsx:'📗',ppt:'📊',pptx:'📊',zip:'📦',rar:'📦',gz:'📦',mp3:'🎵',txt:'📄',md:'📝',py:'🐍',js:'📜',html:'🌐',css:'🎨',json:'📋'};
  const icon=icons[ext]||'📄';
  const textExts=['txt','md','py','js','ts','json','xml','yaml','yml','css','html','sh','sql','log','csv','rb','go','rs','java','c','cpp','h'];
  if(textExts.includes(ext))return `<div class="file-icon" onclick="previewText('${f.rel}','${ext}')">${icon}</div>`;
  return `<div class="file-icon">${icon}</div>`;
}

function renderFiles(){
  let files=[...allFiles];
  if(searchQuery)files=files.filter(f=>(f.original||f.name).toLowerCase().includes(searchQuery)||(f.ai_category||'').toLowerCase().includes(searchQuery));
  if(currentSort==='name')files.sort((a,b)=>(a.original||a.name).localeCompare(b.original||b.name));
  else if(currentSort==='size')files.sort((a,b)=>b.size-a.size);
  document.getElementById('consoleFileCount').textContent=searchQuery?`${files.length}/${allFiles.length} 个`:`${files.length} 个`;
  if(!files.length){grid.innerHTML=`<div class="empty"><div class="icon">${searchQuery?'🔍':'📭'}</div><h3>${searchQuery?'没有匹配':'这里还是空的'}</h3><p>${searchQuery?'试试其他关键词':'拖拽文件到上方区域开始上传'}</p></div>`;return}
  grid.innerHTML=files.map((f,i)=>{
    let badge='';
    if(f.classify_status==='classifying')badge+=`<span class="classifying-tag">🔍 分类中</span>`;
    else if(f.ai_category)badge+=`<span class="ai-tag">🤖 ${f.ai_category}</span>`;
    if(!f.is_owner)badge+=`<span style="font-size:9px;color:var(--text-tertiary)">@${f.owner_name}</span>`;
    const favStar=f.is_owner?`<span class="fav-star${f.is_fav?' active':''}" onclick="toggleFav(event,'${f.name}')" title="收藏">★</span>`:'';
    const visLabels={private:'🔒 私有',public:'🌐 公开',shared:'👥 共享'};
    const visTag=f.is_owner?`<span class="vis-tag ${f.visibility}" onclick="cycleVisibility(event,'${f.name}','${f.visibility}')">${visLabels[f.visibility]}</span>`:`<span class="vis-tag ${f.visibility}" style="cursor:default">${visLabels[f.visibility]}</span>`;
    const delBtn=f.is_owner?`<button class="btn-del" onclick="delFile('${f.rel}')">🗑</button>`:'';
    const cb=batchMode?`<div class="cb-overlay"><input type="checkbox" onchange="toggleSelect('${f.rel}',this.checked)" ${selectedFiles.has(f.rel)?'checked':''}></div>`:'';
    return `<div class="card${batchMode?' show-cb':''}${selectedFiles.has(f.rel)?' selected':''}" style="animation-delay:${i*0.03}s">
      ${cb}<div class="preview">${getFileIcon(f)}</div>
      <div class="info">
        <div class="name" title="${f.original||f.name}">${f.original||f.name}${favStar}</div>
        <div class="meta">${badge}${visTag}<span>${fmtSize(f.size)}</span><span>${new Date(f.mtime).toLocaleDateString('zh-CN')}</span></div>
      </div>
      <div class="actions"><button class="btn-copy" onclick="copyLink('${BASE+f.url}')">🔗</button><button class="btn-down" onclick="downloadFile('${f.rel}')">⬇</button>${delBtn}</div>
    </div>`;
  }).join('');
}

// Upload
async function uploadFiles(files){
  if(!files.length)return;
  const folder=currentFolder||'';
  for(const f of files){
    const fd=new FormData();fd.append('file',f);if(folder)fd.append('folder',folder);
    try{await fetch('/api/upload',{method:'POST',body:fd})}catch(e){}
  }

function getTrashIcon(item){
  const mime=item.mime_type||'';
  if(mime.startsWith('image/'))return '🖼️';if(mime.startsWith('video/'))return '🎬';
  const ext=(item.original_name||'').split('.').pop().toLowerCase();
  const icons={pdf:'📕',doc:'📘',docx:'📘',zip:'📦',rar:'📦',mp3:'🎵',txt:'📄'};
  return icons[ext]||'📄';
}
function renderTrash(){
  const gridEl=document.getElementById('trashGrid'),info=document.getElementById('trashInfo');
  if(!trashItems.length){gridEl.innerHTML='<div class="empty"><div class="icon">📭</div><h3>回收站是空的</h3></div>';info.textContent='回收站 · 空';return}
  info.textContent=`回收站 · ${trashItems.length} 项`;
  gridEl.innerHTML=trashItems.map(item=>{
    const d=new Date(item.deleted_at),dateStr=d.toLocaleDateString('zh-CN'),rd=item.remaining_days;
    let badge='',badgeCls='';
    if(rd<=1){badge='⚠️ 即将清理';badgeCls='danger'}else if(rd<=7){badge=`⏳ ${rd}天后清理`;badgeCls='warn'}else{badge=`📅 ${rd}天后到期`;badgeCls='ok'}
    return `<div class="trash-card${trashSelected.has(item.id)?' selected':''}">
      <div class="icon-big">${getTrashIcon(item)}</div>
      <div class="info">
        <div class="name">${item.original_name}</div>
        <div class="meta"><span>${fmtSize(item.size)}</span><span>·</span><span>${dateStr}</span><span class="expire-badge ${badgeCls}">${badge}</span></div>
      </div>
      <div class="actions">
        <button class="btn-restore" onclick="restoreTrash(${item.id})">↩ 恢复</button>
        <button class="btn-purge" onclick="permDelete(${item.id})">永久删除</button>
      </div>
    </div>`;
  }).join('');
}

  const t=TOOLS.find(x=>x.id===id);const input=document.getElementById('toolFileInput');
  if(!input.files.length){toast('请选择文件','error');return}
  const fd=new FormData();fd.append('file',input.files[0]);
  if(id==='img_compress'){fd.append('quality',document.getElementById('toolQuality')?.value||'70');fd.append('max_width',document.getElementById('toolMaxW')?.value||'0')}
  if(id==='img_resize'){fd.append('width',document.getElementById('toolWidth')?.value||'800');fd.append('height',document.getElementById('toolHeight')?.value||'0')}
  if(id==='img_convert')fd.append('format',document.getElementById('toolFormat')?.value||'jpeg')
  if(id==='pdf_split')fd.append('pages',document.getElementById('toolPages')?.value||'')
  try{
    const r=await fetch(t.api,{method:'POST',body:fd});const d=await r.json();
    if(d.error){toast(d.error,'error')}else{toast('完成！','success');closePreview()}
  }catch(e){toast('执行失败','error')}
}
</script>
</body>
</html>
