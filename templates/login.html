<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>登录 - 文件管理</title>
<style>
:root{
  --bg:#0b0e11;--surface:#161a1f;--surface2:#1e2228;--border:#2a2f36;
  --text:#e2e6ea;--text2:#8b9199;--text3:#5c6269;--accent:#4d9df6;--accent2:#3a7fd4;
  --red:#f04747;--green:#43b581;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans SC",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;display:flex;
  align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;
}
.bg{position:fixed;inset:0;overflow:hidden;z-index:0}
.bg::before{
  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle at 30% 40%, rgba(77,157,246,.06) 0%, transparent 50%),
              radial-gradient(circle at 70% 60%, rgba(142,106,240,.05) 0%, transparent 50%);
}
.card{
  position:relative;z-index:1;background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:36px 32px;width:380px;box-shadow:0 12px 40px rgba(0,0,0,.4);
}
.card .logo-area{text-align:center;margin-bottom:28px}
.card .logo-area .icon{font-size:42px;margin-bottom:8px}
.card .logo-area h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
.card .logo-area p{font-size:12px;color:var(--text3);margin-top:4px}
.field{margin-bottom:16px}
.field label{display:block;font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.05em}
.field input{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:8px;padding:11px 14px;color:var(--text);font-size:14px;
  outline:none;transition:border .2s,box-shadow .2s;
}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,157,246,.15)}
.field input::placeholder{color:var(--text3)}
.btn{
  width:100%;margin-top:6px;padding:11px;background:var(--accent);border:none;
  border-radius:8px;color:#fff;font-size:14px;cursor:pointer;font-weight:600;
  transition:all .15s;
}
.btn:hover{background:var(--accent2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(77,157,246,.3)}
.btn:active{transform:translateY(0)}
.switch{text-align:center;margin-top:18px;font-size:12px;color:var(--text3)}
.switch a{color:var(--accent);cursor:pointer;text-decoration:none;font-weight:500}
.switch a:hover{text-decoration:underline}
.err{
  color:var(--red);font-size:12px;margin-top:6px;display:none;
  background:rgba(240,71,71,.08);padding:8px 12px;border-radius:6px;
}
</style>
</head>
<body>
<div class="bg"></div>

<div class="card" id="loginBox">
  <div class="logo-area">
    <div class="icon">📁</div>
    <h1>文件管理</h1>
    <p>登录以管理你的文件</p>
  </div>
  <div class="field"><label>用户名</label><input type="text" id="lUser" placeholder="输入用户名" autocomplete="username"></div>
  <div class="field"><label>密码</label><input type="password" id="lPass" placeholder="输入密码" onkeydown="if(event.key==='Enter')login()" autocomplete="current-password"></div>
  <div class="err" id="lErr"></div>
  <button class="btn" onclick="login()">登 录</button>
  <div class="switch">没有账号？<a onclick="showReg()">立即注册</a></div>
</div>

<div class="card" id="regBox" style="display:none">
  <div class="logo-area">
    <div class="icon">📝</div>
    <h1>创建账号</h1>
    <p>注册后即可开始使用</p>
  </div>
  <div class="field"><label>用户名</label><input type="text" id="rUser" placeholder="2-32 个字符" autocomplete="username"></div>
  <div class="field"><label>密码</label><input type="password" id="rPass" placeholder="至少 4 位" onkeydown="if(event.key==='Enter')register()" autocomplete="new-password"></div>
  <div class="err" id="rErr"></div>
  <button class="btn" onclick="register()">注 册</button>
  <div class="switch">已有账号？<a onclick="showLogin()">去登录</a></div>
</div>

<script>
function showReg(){document.getElementById('loginBox').style.display='none';document.getElementById('regBox').style.display='block';document.getElementById('rUser').focus()}
function showLogin(){document.getElementById('loginBox').style.display='block';document.getElementById('regBox').style.display='none';document.getElementById('lUser').focus()}
async function login(){
  document.getElementById('lErr').style.display='none';
  const u=document.getElementById('lUser').value.trim(),p=document.getElementById('lPass').value;
  if(!u||!p)return;
  const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
  const d=await res.json();
  if(d.error){const e=document.getElementById('lErr');e.textContent=d.error;e.style.display='block'}
  else location.reload()
}
async function register(){
  document.getElementById('rErr').style.display='none';
  const u=document.getElementById('rUser').value.trim(),p=document.getElementById('rPass').value;
  if(!u||!p)return;
  const res=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
  const d=await res.json();
  if(d.error){const e=document.getElementById('rErr');e.textContent=d.error;e.style.display='block'}
  else location.reload()
}
</script>
</body>
</html>
